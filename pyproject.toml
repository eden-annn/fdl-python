[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdl-python"
version = "0.0.2"
description = "ASC Framing Decision List (FDL) Python library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Eden An", email = "eden.annn@gmail.com"}
]
keywords = ["ASC", "FDL", "Framing Decision List", "cinematography"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/eden-annn/fdl-python"
Repository = "https://github.com/eden-annn/fdl-python"
Issues = "https://github.com/eden-annn/fdl-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/fdl"]

[tool.hatch.build.targets.sdist]
include = [
    "python/fdl",
    "LICENSE",
    "NOTICE",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "python"
strict = true

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]