[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdl-python"
version = "0.0.2"
description = "ASC Framing Decision List (FDL) Python library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Eden An", email = "eden.annn@gmail.com"}
]
keywords = ["ASC", "FDL", "Framing Decision List", "cinematography"]
dependencies = [
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/eden-annn/fdl-python"
Repository = "https://github.com/eden-annn/fdl-python"
Issues = "https://github.com/eden-annn/fdl-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/fdl"]

[tool.hatch.build.targets.sdist]
include = [
    "python/fdl",
    "LICENSE",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "python"
strict = true

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]